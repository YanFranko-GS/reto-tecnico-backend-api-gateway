server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/orders/**

            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/inventario/producto/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/reto-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info